server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Routage pour l'application React (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirection des appels API vers le Backend
    location /api/ {
        # Sur Linux/Fedora, host.docker.internal pointe vers votre machine hôte (où tourne le backend)
        proxy_pass http://host.docker.internal:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
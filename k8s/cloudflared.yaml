apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - --url
            - http://traefik.kube-system.svc.cluster.local:80
            - --no-autoupdate
          resources:
            requests:
              memory: "30Mi"
              cpu: "10m"
            limits:
              memory: "60Mi"
              cpu: "50m"

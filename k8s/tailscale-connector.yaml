apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-connector
  namespace: tailscale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-connector
  namespace: tailscale
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "update", "create"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-connector
  namespace: tailscale
subjects:
- kind: ServiceAccount
  name: tailscale-connector
  namespace: tailscale
roleRef:
  kind: Role
  name: tailscale-connector
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-connector
  namespace: tailscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tailscale-connector
  template:
    metadata:
      labels:
        app: tailscale-connector
    spec:
      serviceAccountName: tailscale-connector
      containers:
      - name: tailscale
        image: docker.io/tailscale/tailscale:latest
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: TS_AUTH_KEY
        - name: TS_EXTRA_ARGS
          value: "--accept-routes --reset"
        - name: TS_USERSPACE
          value: "false"
        - name: TS_STATE_DIR
          value: /var/lib/tailscale
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /var/lib/tailscale
          name: tailscale-state
        - mountPath: /dev/net/tun
          name: dev-net-tun
      - name: db-proxy
        image: alpine/socat
        args:
        - "TCP-LISTEN:3306,fork,reuseaddr"
        - "TCP:10.0.2.4:3306"
        ports:
        - containerPort: 3306
      volumes:
      - name: tailscale-state
        emptyDir: {}
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
---
apiVersion: v1
kind: Service
metadata:
  name: tailscale-connector
  namespace: tailscale
spec:
  selector:
    app: tailscale-connector
  ports:
  - port: 3306
    targetPort: 3306
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: azure-mysql
  namespace: default
spec:
  type: ExternalName
  externalName: tailscale-connector.tailscale.svc.cluster.local
  ports:
  - port: 3306

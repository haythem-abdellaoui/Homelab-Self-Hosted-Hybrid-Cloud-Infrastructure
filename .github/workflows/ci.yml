name: Production Grade CI Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'App/conduit-realworld-example-app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'App/conduit-realworld-example-app/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  APP_DIR: App/conduit-realworld-example-app

jobs:
  # -------------------------------------------------------------
  # JOB 1 : TESTS & QUALITÉ CODE
  # -------------------------------------------------------------
  quality-and-tests:
    name: 🧪 Quality Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '${{ env.APP_DIR }}/package-lock.json'

      - name: Install Dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm ci
          npm install -D jsdom

      - name: Run Tests
        working-directory: ${{ env.APP_DIR }}
        run: npm test --if-present

  # -------------------------------------------------------------
  # JOB 2 : BUILD & PUSH BACKEND
  # -------------------------------------------------------------
  build-backend:
    name: 📦 Build & Push Backend
    needs: quality-and-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ env.APP_DIR }}/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/haythem-abdellaoui/proxmox-homelab-infrastructure-backend:latest
            ghcr.io/haythem-abdellaoui/proxmox-homelab-infrastructure-backend:${{ github.sha }}

  # -------------------------------------------------------------
  # JOB 3 : BUILD & PUSH FRONTEND
  # -------------------------------------------------------------
  build-frontend:
    name: 🎨 Build & Push Frontend
    needs: quality-and-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ env.APP_DIR }}/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/haythem-abdellaoui/proxmox-homelab-infrastructure-frontend:latest
            ghcr.io/haythem-abdellaoui/proxmox-homelab-infrastructure-frontend:${{ github.sha }}

  # -------------------------------------------------------------
  # JOB 4 : MISE À JOUR DES MANIFESTS K8S (GITOPS)
  # -------------------------------------------------------------
  update-manifests:
    name: 🚀 Update K8s Manifests
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update Image Tags in K8s Files
        run: |
          sed -i 's|image: ghcr.io/haythem-abdellaoui/proxmox-homelab-infrastructure-backend:.*|image: ghcr.io/haythem-abdellaoui/proxmox-homelab-infrastructure-backend:${{ github.sha }}|g' k8s/backend.yaml
          sed -i 's|image: ghcr.io/haythem-abdellaoui/proxmox-homelab-infrastructure-frontend:.*|image: ghcr.io/haythem-abdellaoui/proxmox-homelab-infrastructure-frontend:${{ github.sha }}|g' k8s/frontend.yaml

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "ci: update k8s images to sha-${{ github.sha }}" || echo "No changes to commit"
          git push
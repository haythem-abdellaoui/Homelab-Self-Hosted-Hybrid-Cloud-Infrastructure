---
- name: Installer HAProxy
  apt:
    name: haproxy
    state: present
    update_cache: yes

- name: Déployer la configuration HAProxy
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    mode: '0644'
  notify: Restart HAProxy

- name: S'assurer que HAProxy est démarré et activé au boot
  service:
    name: haproxy
    state: started
    enabled: yes

    